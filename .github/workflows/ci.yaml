name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.15.1"
  KUBECONFORM_VERSION: "0.8.0"
  YQ_VERSION: "4.54.1"

jobs:
  rules-and-dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install promtool, yq
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          promtool --version

      - name: promtool check + test rules, validate dashboard JSON
        run: ./scripts/check.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yaml .

      - name: kubeconform (kustomize build of config/ + Argo CD Applications)
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
          SCHEMAS=(-schema-location default
                   -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
          kubectl kustomize config | kubeconform -strict -summary "${SCHEMAS[@]}" -
          kubeconform -strict -summary "${SCHEMAS[@]}" apps/
