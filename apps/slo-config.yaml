# SLO rules, probes and Grafana dashboards from config/ (kustomize).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bhavishyajain545/observability-slo-stack.git
    targetRevision: main
    path: config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
