extends: default
ignore: |
  build/
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  colons:
    max-spaces-after: -1      # values files align { requests / limits } columns
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  indentation:
    indent-sequences: whatever
