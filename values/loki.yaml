# Loki single binary, filesystem storage, 3-day retention. No object store,
# no caches, no gateway: a homelab doesn't need them.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_query_lookback: 72h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  pattern_ingester:
    enabled: false
  ruler:
    enable_api: false
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { memory: 640Mi }
  persistence:
    enabled: true
    size: 5Gi

# everything below is for the scalable / distributed modes -- off
read:    { replicas: 0 }
write:   { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
memcachedExporter: { enabled: false }
sidecar:
  rules:
    enabled: false
